# Local PostgreSQL for the deal intelligence engine.
#   docker compose up -d
# Then point the app at it (matches the default DATABASE_URL):
#   postgresql+psycopg://dealintel:dealintel@localhost:5432/dealintel
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dealintel
      POSTGRES_PASSWORD: dealintel
      POSTGRES_DB: dealintel
    ports:
      - "5432:5432"
    volumes:
      - dealintel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealintel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dealintel_pgdata:
